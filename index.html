<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>수업 등록</title>

  <script src="https://js.tosspayments.com/v2/standard"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f6f8;
      color: #191f28;
      font-family:
        Pretendard,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    select,
    input {
      font: inherit;
    }

    .page {
      width: min(100%, 560px);
      margin: 0 auto;
      padding: 32px 18px 60px;
    }

    .header {
      margin-bottom: 22px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 30px;
      line-height: 1.25;
    }

    .header p {
      margin: 0;
      color: #6b7684;
      font-size: 15px;
      line-height: 1.6;
    }

    /* ---------- 미디어 선택 카드 (사진1 / 사진2 / MOV) ---------- */
    .media-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 22px;
    }

    .media-card {
      position: relative;
      display: block;
      width: 100%;
      padding: 0;
      border: 1px solid #e5e8eb;
      border-radius: 18px;
      overflow: hidden;
      background: #ffffff;
      cursor: pointer;
      text-align: left;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .media-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.09);
    }

    .media-card.video-card {
      grid-column: 1 / -1;
    }

    .media-thumb {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
      background: #dfe3e8;
    }

    .video-card .media-thumb {
      height: 200px;
    }

    .play-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .play-overlay span {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .media-label {
      padding: 12px 14px 14px;
    }

    .media-label strong {
      display: block;
      font-size: 16px;
      margin-bottom: 3px;
    }

    .media-label span {
      display: inline-block;
      color: #3182f6;
      font-size: 13px;
      font-weight: 700;
    }

    .media-card.selected {
      border-color: #3182f6;
      box-shadow: 0 0 0 3px rgba(49, 130, 246, 0.15);
    }

    /* ---------- 체험 수업 신청 섹션 ---------- */
    .trial-section {
      margin-bottom: 20px;
      padding: 20px;
      background: #ffffff;
      border: 1px solid #e5e8eb;
      border-radius: 16px;
    }

    .trial-section h2 {
      margin: 0 0 14px;
      font-size: 18px;
    }

    .trial-section video {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 16px;
      background: #000;
    }

    .trial-result {
      display: none;
      margin-top: 14px;
      padding: 14px;
      border-radius: 10px;
      background: #ebfbee;
      border: 1px solid #8ce99a;
      color: #2b8a3e;
      font-size: 14px;
      line-height: 1.6;
    }

    .trial-result.show {
      display: block;
    }

    .card {
      overflow: hidden;
      background: #ffffff;
      border: 1px solid #e5e8eb;
      border-radius: 20px;
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.06);
    }

    .food-image {
      display: grid;
      place-items: center;
      height: 220px;
      background:
        radial-gradient(circle at 25% 20%, #ffd58d, transparent 28%),
        linear-gradient(135deg, #ff9f43, #ff7043);
      font-size: 92px;
      user-select: none;
    }

    .content {
      padding: 24px;
    }

    .badge {
      display: inline-block;
      margin-bottom: 11px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #fff3e8;
      color: #e85d04;
      font-size: 13px;
      font-weight: 700;
    }

    .product-title {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .description {
      margin: 0 0 24px;
      color: #6b7684;
      line-height: 1.65;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 0;
      border-top: 1px solid #edf0f2;
    }

    .row-label {
      font-weight: 700;
    }

    .unit-price {
      color: #4e5968;
    }

    .total-row {
      margin-top: 2px;
    }

    .total-label {
      font-size: 18px;
      font-weight: 800;
    }

    .total-price {
      font-size: 25px;
      font-weight: 900;
      color: #e8590c;
    }

    .customer-section {
      margin-top: 18px;
      padding: 20px;
      background: #ffffff;
      border: 1px solid #e5e8eb;
      border-radius: 16px;
    }

    .customer-section h2 {
      margin: 0 0 17px;
      font-size: 18px;
    }

    .field {
      margin-bottom: 15px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: #4e5968;
      font-size: 14px;
      font-weight: 700;
    }

    .field input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d1d6db;
      border-radius: 10px;
      outline: none;
    }

    .field input:focus {
      border-color: #3182f6;
      box-shadow: 0 0 0 3px rgba(49, 130, 246, 0.12);
    }

    .pay-button {
      width: 100%;
      margin-top: 20px;
      padding: 17px;
      border: 0;
      border-radius: 13px;
      background: #3182f6;
      color: #ffffff;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .pay-button:hover {
      transform: translateY(-1px);
    }

    .pay-button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
      transform: none;
    }

    .trial-submit-button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 13px;
      background: #191f28;
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .notice {
      margin: 15px 5px 0;
      color: #8b95a1;
      font-size: 13px;
      line-height: 1.55;
      text-align: center;
    }

    .result-box {
      display: none;
      margin-bottom: 20px;
      padding: 22px;
      border-radius: 16px;
      background: #ffffff;
      border: 1px solid #e5e8eb;
      text-align: center;
    }

    .result-box.show {
      display: block;
    }

    .result-box.success {
      border-color: #8ce99a;
      background: #ebfbee;
    }

    .result-box.error {
      border-color: #ffa8a8;
      background: #fff5f5;
    }

    .result-icon {
      margin-bottom: 10px;
      font-size: 42px;
    }

    .result-title {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .result-message {
      margin: 0;
      color: #4e5968;
      line-height: 1.6;
      word-break: keep-all;
    }

    .order-detail {
      margin-top: 16px;
      padding: 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.74);
      color: #333d4b;
      font-size: 14px;
      line-height: 1.7;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .retry-button {
      margin-top: 16px;
      padding: 12px 17px;
      border: 1px solid #d1d6db;
      border-radius: 10px;
      background: #ffffff;
      color: #333d4b;
      font-weight: 700;
      cursor: pointer;
    }

    .loading {
      display: none;
      margin-bottom: 20px;
      padding: 22px;
      border-radius: 16px;
      background: #ffffff;
      border: 1px solid #e5e8eb;
      text-align: center;
    }

    .loading.show {
      display: block;
    }

    .spinner {
      width: 34px;
      height: 34px;
      margin: 0 auto 13px;
      border: 4px solid #e5e8eb;
      border-top-color: #3182f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 480px) {
      .page {
        padding-top: 22px;
      }

      .header h1 {
        font-size: 27px;
      }

      .food-image {
        height: 190px;
      }

      .content {
        padding: 21px;
      }

      .media-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="header">
      <h1>수업 등록</h1>
      <p>
        원하시는 수업을 선택해서 바로 등록하거나, 체험 수업을 신청해보세요.
      </p>
    </header>

    <!-- 사진1 / 사진2 / MOV 선택 카드 -->
    <section class="media-grid">
      <button
        type="button"
        id="cardWeekly1"
        class="media-card"
        onclick="selectProduct('weekly1')"
      >
        <img
          class="media-thumb"
          src="https://raw.githubusercontent.com/baezzi1208/youth/main/play1.jpeg"
          alt="주 1회 수업"
        />
        <div class="media-label">
          <strong>주 1회 수업</strong>
          <span>눌러서 바로 등록하기 →</span>
        </div>
      </button>

      <button
        type="button"
        id="cardWeekly2"
        class="media-card"
        onclick="selectProduct('weekly2')"
      >
        <img
          class="media-thumb"
          src="https://raw.githubusercontent.com/baezzi1208/youth/main/play2.jpeg"
          alt="주 2회 수업"
        />
        <div class="media-label">
          <strong>주 2회 수업</strong>
          <span>눌러서 바로 등록하기 →</span>
        </div>
      </button>

      <button
        type="button"
        id="cardTrial"
        class="media-card video-card"
        onclick="openTrial()"
      >
        <video
          class="media-thumb"
          muted
          playsinline
          preload="metadata"
        >
          <source
            src="https://raw.githubusercontent.com/baezzi1208/youth/main/mov.mp4"
            type="video/mp4"
          />
        </video>
        <div class="play-overlay"><span>▶</span></div>
        <div class="media-label">
          <strong>체험 수업</strong>
          <span>눌러서 체험 수업 신청하기 →</span>
        </div>
      </button>
    </section>

    <!-- 체험 수업 신청 영역 (MOV 클릭 시 표시) -->
    <section id="trialSection" class="trial-section" style="display: none">
      <h2>체험 수업 신청</h2>

      <video controls preload="metadata">
        <source
          src="https://raw.githubusercontent.com/baezzi1208/youth/main/mov.mp4"
          type="video/mp4"
        />
      </video>

      <div class="field">
        <label for="trialName">이름</label>
        <input
          id="trialName"
          type="text"
          maxlength="30"
          placeholder="홍길동"
          autocomplete="name"
        />
      </div>

      <div class="field">
        <label for="trialPhone">연락처</label>
        <input
          id="trialPhone"
          type="tel"
          maxlength="20"
          placeholder="010-0000-0000"
          autocomplete="tel"
        />
      </div>

      <button
        id="trialSubmitButton"
        class="trial-submit-button"
        type="button"
        onclick="submitTrial()"
      >
        체험 수업 신청하기
      </button>

      <div id="trialResult" class="trial-result"></div>
    </section>

    <section id="loadingBox" class="loading">
      <div class="spinner"></div>
      <strong>결제를 승인하고 있습니다.</strong>
      <p>화면을 닫거나 새로고침하지 마세요.</p>
    </section>

    <section id="resultBox" class="result-box">
      <div id="resultIcon" class="result-icon"></div>
      <h2 id="resultTitle" class="result-title"></h2>
      <p id="resultMessage" class="result-message"></p>
      <div id="orderDetail" class="order-detail"></div>
      <button
        id="retryButton"
        class="retry-button"
        type="button"
        onclick="returnToOrderPage()"
      >
        주문 페이지로 돌아가기
      </button>
    </section>

    <div id="orderArea">
      <section class="card">
        <div class="food-image" aria-label="수업 등록">
          🏃
        </div>

        <div class="content">
          <span id="productBadge" class="badge">선택된 수업</span>

          <h2 id="productTitle" class="product-title">주 1회 수업</h2>

          <p id="productDescription" class="description">
            위에서 사진을 눌러 원하시는 수업을 선택하세요. 선택한 수업으로
            바로 결제가 진행됩니다.
          </p>

          <div class="row">
            <div>
              <div class="row-label">가격</div>
              <div class="unit-price">1개월 기준</div>
            </div>

            <strong id="unitPriceText">150,000원</strong>
          </div>

          <div class="row total-row">
            <span class="total-label">총 결제금액</span>
            <strong id="totalPrice" class="total-price">150,000원</strong>
          </div>
        </div>
      </section>

      <section class="customer-section">
        <h2>주문자 정보</h2>

        <div class="field">
          <label for="customerName">이름</label>
          <input
            id="customerName"
            type="text"
            maxlength="30"
            placeholder="홍길동"
            autocomplete="name"
          />
        </div>

        <div class="field">
          <label for="customerEmail">이메일</label>
          <input
            id="customerEmail"
            type="email"
            maxlength="100"
            placeholder="example@email.com"
            autocomplete="email"
          />
        </div>
      </section>

      <button id="payButton" class="pay-button" type="button">
        150,000원 결제하기
      </button>

      <p class="notice">
        테스트 클라이언트 키를 사용하면 실제 금액이 청구되지 않습니다.<br />
        실결제 운영 전에는 서버 측 주문 금액 검증과 주문 DB가 필요합니다.
      </p>
    </div>
  </main>

  <script>
    /*
     * 반드시 토스 개발자센터의 테스트 클라이언트 키로 교체하세요.
     * test_gck_ 또는 test_ck_ 형태의 클라이언트 키입니다.
     * 시크릿 키를 여기에 넣으면 안 됩니다.
     */
    const CLIENT_KEY = "test_ck_Ba5PzR0ArnE9lwPR0bJzVvmYnNeD";

    /*
     * 체험 수업 신청을 받을 이메일 주소입니다.
     * 실제 운영 시 본인 이메일 주소로 꼭 교체해주세요.
     */
    const INSTRUCTOR_EMAIL = "여기에_이메일_주소를_입력하세요";

    // 사진1 = 주1회 수업, 사진2 = 주2회 수업
    const PRODUCTS = {
      weekly1: {
        key: "weekly1",
        badge: "주 1회 수업",
        name: "주 1회 수업",
        description: "매주 1회, 꾸준히 기초부터 다져가는 수업입니다.",
        unitPrice: 150000
      },
      weekly2: {
        key: "weekly2",
        badge: "주 2회 수업",
        name: "주 2회 수업",
        description: "매주 2회, 더 빠른 성장을 원하는 분들을 위한 수업입니다.",
        unitPrice: 200000
      }
    };

    let currentProductKey = "weekly1";

    const quantity = 1; // 수업 등록은 항상 1개로 결제합니다.

    const productBadge = document.getElementById("productBadge");
    const productTitle = document.getElementById("productTitle");
    const productDescription = document.getElementById(
      "productDescription"
    );
    const unitPriceText = document.getElementById("unitPriceText");
    const totalPriceElement = document.getElementById("totalPrice");
    const payButton = document.getElementById("payButton");
    const customerNameInput = document.getElementById("customerName");
    const customerEmailInput = document.getElementById("customerEmail");

    const orderArea = document.getElementById("orderArea");
    const loadingBox = document.getElementById("loadingBox");
    const resultBox = document.getElementById("resultBox");
    const resultIcon = document.getElementById("resultIcon");
    const resultTitle = document.getElementById("resultTitle");
    const resultMessage = document.getElementById("resultMessage");
    const orderDetail = document.getElementById("orderDetail");

    const cardWeekly1 = document.getElementById("cardWeekly1");
    const cardWeekly2 = document.getElementById("cardWeekly2");
    const trialSection = document.getElementById("trialSection");
    const trialName = document.getElementById("trialName");
    const trialPhone = document.getElementById("trialPhone");
    const trialResult = document.getElementById("trialResult");

    function formatWon(amount) {
      return new Intl.NumberFormat("ko-KR").format(amount) + "원";
    }

    function getCurrentProduct() {
      return PRODUCTS[currentProductKey];
    }

    function getTotalAmount() {
      return getCurrentProduct().unitPrice * quantity;
    }

    function updatePrice() {
      const product = getCurrentProduct();
      const amount = getTotalAmount();

      productBadge.textContent = product.badge;
      productTitle.textContent = product.name;
      productDescription.textContent = product.description;
      unitPriceText.textContent = formatWon(product.unitPrice);
      totalPriceElement.textContent = formatWon(amount);
      payButton.textContent = `${formatWon(amount)} 결제하기`;
    }

    // 사진1 / 사진2 클릭 시: 수업 선택 + 결제 영역으로 스크롤
    function selectProduct(key) {
      currentProductKey = key;
      updatePrice();

      cardWeekly1.classList.toggle("selected", key === "weekly1");
      cardWeekly2.classList.toggle("selected", key === "weekly2");

      trialSection.style.display = "none";

      orderArea.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    // MOV 클릭 시: 영상 + 체험 신청 폼 노출
    function openTrial() {
      trialSection.style.display = "block";
      trialResult.classList.remove("show");
      trialResult.textContent = "";

      trialSection.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function submitTrial() {
      const name = trialName.value.trim();
      const phone = trialPhone.value.trim();

      if (!name) {
        alert("이름을 입력해주세요.");
        trialName.focus();
        return;
      }

      if (!phone) {
        alert("연락처를 입력해주세요.");
        trialPhone.focus();
        return;
      }

      /*
       * 별도 서버가 없어서, 신청 내용을 이메일로 보내는 방식으로
       * 처리합니다. INSTRUCTOR_EMAIL을 실제 이메일로 교체하면
       * 신청자가 '신청하기'를 누를 때 메일 앱이 열립니다.
       * 나중에 구글폼이나 서버 연동으로 교체할 수 있습니다.
       */
      const subject = encodeURIComponent(`체험 수업 신청 - ${name}`);
      const body = encodeURIComponent(
        `이름: ${name}\n연락처: ${phone}`
      );

      if (
        INSTRUCTOR_EMAIL &&
        INSTRUCTOR_EMAIL !== "여기에_이메일_주소를_입력하세요"
      ) {
        window.location.href =
          `mailto:${INSTRUCTOR_EMAIL}?subject=${subject}&body=${body}`;
      }

      trialResult.classList.add("show");
      trialResult.textContent =
        "체험 수업 신청이 접수되었어요. 빠르게 연락드릴게요!";
    }

    function createRandomId(prefix) {
      const randomPart =
        crypto.randomUUID?.().replaceAll("-", "") ||
        Math.random().toString(36).slice(2) +
          Date.now().toString(36);

      return `${prefix}_${randomPart}`.slice(0, 50);
    }

    function createOrderId() {
      /*
       * 토스 orderId는 영문, 숫자, -, _를 사용하고
       * 6자 이상 64자 이하로 생성합니다.
       */
      return createRandomId("CLASS");
    }

    function createCustomerKey() {
      return createRandomId("customer");
    }

    function validateOrderForm() {
      const customerName = customerNameInput.value.trim();
      const customerEmail = customerEmailInput.value.trim();

      if (!customerName) {
        alert("주문자 이름을 입력해주세요.");
        customerNameInput.focus();
        return false;
      }

      if (!customerEmail) {
        alert("이메일을 입력해주세요.");
        customerEmailInput.focus();
        return false;
      }

      if (!customerEmailInput.checkValidity()) {
        alert("올바른 이메일 주소를 입력해주세요.");
        customerEmailInput.focus();
        return false;
      }

      if (
        !CLIENT_KEY ||
        CLIENT_KEY === "여기에_토스_테스트_클라이언트_키"
      ) {
        alert(
          "index.html의 CLIENT_KEY를 토스 테스트 클라이언트 키로 교체해주세요."
        );
        return false;
      }

      return true;
    }

    async function requestPayment() {
      if (!validateOrderForm()) {
        return;
      }

      const product = getCurrentProduct();
      const amount = getTotalAmount();
      const orderId = createOrderId();
      const customerKey = createCustomerKey();

      /*
       * 리다이렉트 후 승인 금액을 한 번 더 비교하기 위한 값입니다.
       * 다만 실서비스에서는 이 값을 브라우저가 아니라 서버 DB에 저장해야 합니다.
       */
      sessionStorage.setItem(
        "pendingOrder",
        JSON.stringify({
          orderId,
          amount,
          orderName: product.name
        })
      );

      payButton.disabled = true;
      payButton.textContent = "결제창을 열고 있습니다.";

      try {
        const tossPayments = TossPayments(CLIENT_KEY);

        const payment = tossPayments.payment({
          customerKey
        });

        await payment.requestPayment({
          method: "CARD",

          amount: {
            currency: "KRW",
            value: amount
          },

          orderId,
          orderName: product.name,

          customerName: customerNameInput.value.trim(),
          customerEmail: customerEmailInput.value.trim(),

          successUrl:
            window.location.origin +
            window.location.pathname +
            "?payment=success",

          failUrl:
            window.location.origin +
            window.location.pathname +
            "?payment=fail"
        });
      } catch (error) {
        console.error(error);

        payButton.disabled = false;
        updatePrice();

        alert(
          error?.message ||
          "결제창을 여는 중 오류가 발생했습니다."
        );
      }
    }

    async function confirmPayment() {
      const params = new URLSearchParams(window.location.search);

      const paymentKey = params.get("paymentKey");
      const orderId = params.get("orderId");
      const amount = Number(params.get("amount"));

      const pendingOrderText =
        sessionStorage.getItem("pendingOrder");

      let pendingOrder = null;

      try {
        pendingOrder = pendingOrderText
          ? JSON.parse(pendingOrderText)
          : null;
      } catch (error) {
        console.error("주문 정보 읽기 실패:", error);
      }

      orderArea.style.display = "none";
      loadingBox.classList.add("show");

      if (!paymentKey || !orderId || !Number.isFinite(amount)) {
        loadingBox.classList.remove("show");

        showResult({
          success: false,
          title: "결제 정보가 올바르지 않습니다.",
          message:
            "결제 승인에 필요한 정보가 전달되지 않았습니다."
        });

        return;
      }

      /*
       * 브라우저에 저장했던 주문 정보와 리다이렉트 결과를 비교합니다.
       * 이것은 테스트용 보조 검증입니다.
       *
       * 실결제 서비스에서는 confirm.js가 서버 DB의 주문 금액과
       * 반드시 대조해야 합니다.
       */
      if (
        pendingOrder &&
        (
          pendingOrder.orderId !== orderId ||
          Number(pendingOrder.amount) !== amount
        )
      ) {
        loadingBox.classList.remove("show");

        showResult({
          success: false,
          title: "주문 정보가 일치하지 않습니다.",
          message:
            "결제 요청 금액 또는 주문번호가 변경되었습니다."
        });

        return;
      }

      try {
        const response = await fetch(
          "/.netlify/functions/confirm",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              paymentKey,
              orderId,
              amount
            })
          }
        );

        let result;

        try {
          result = await response.json();
        } catch {
          result = {
            message:
              "승인 서버에서 올바르지 않은 응답을 반환했습니다."
          };
        }

        loadingBox.classList.remove("show");

        if (!response.ok) {
          throw new Error(
            result.message ||
            result.error?.message ||
            result.code ||
            "결제 승인에 실패했습니다."
          );
        }

        sessionStorage.removeItem("pendingOrder");

        showResult({
          success: true,
          title: "결제가 완료되었습니다.",
          message:
            "수업 등록이 정상적으로 승인되었습니다.",
          detail: `
            <strong>주문번호</strong>: ${escapeHtml(orderId)}<br />
            <strong>결제금액</strong>: ${formatWon(amount)}<br />
            <strong>결제상태</strong>: ${escapeHtml(result.status || "DONE")}
          `
        });
      } catch (error) {
        console.error("결제 승인 오류:", error);

        loadingBox.classList.remove("show");

        showResult({
          success: false,
          title: "결제 승인에 실패했습니다.",
          message:
            error?.message ||
            "잠시 후 다시 시도해주세요.",
          detail: `
            <strong>주문번호</strong>: ${escapeHtml(orderId)}<br />
            <strong>요청금액</strong>: ${formatWon(amount)}
          `
        });
      }
    }

    function handlePaymentFailure() {
      const params = new URLSearchParams(window.location.search);

      const code = params.get("code") || "UNKNOWN_ERROR";
      const message =
        params.get("message") ||
        "결제 과정이 취소되었거나 실패했습니다.";
      const orderId = params.get("orderId");

      orderArea.style.display = "none";

      showResult({
        success: false,
        title:
          code === "PAY_PROCESS_CANCELED"
            ? "결제가 취소되었습니다."
            : "결제를 완료하지 못했습니다.",
        message,
        detail: `
          <strong>오류 코드</strong>: ${escapeHtml(code)}
          ${
            orderId
              ? `<br /><strong>주문번호</strong>: ${escapeHtml(orderId)}`
              : ""
          }
        `
      });
    }

    function showResult({
      success,
      title,
      message,
      detail = ""
    }) {
      resultBox.className =
        `result-box show ${success ? "success" : "error"}`;

      resultIcon.textContent = success ? "✅" : "⚠️";
      resultTitle.textContent = title;
      resultMessage.textContent = message;

      if (detail) {
        orderDetail.style.display = "block";
        orderDetail.innerHTML = detail;
      } else {
        orderDetail.style.display = "none";
        orderDetail.innerHTML = "";
      }
    }

    function returnToOrderPage() {
      sessionStorage.removeItem("pendingOrder");

      window.location.href =
        window.location.origin + window.location.pathname;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function initializePage() {
      payButton.addEventListener("click", requestPayment);

      selectProduct("weekly1");

      const params = new URLSearchParams(window.location.search);
      const paymentResult = params.get("payment");

      if (paymentResult === "success") {
        confirmPayment();
      } else if (paymentResult === "fail") {
        handlePaymentFailure();
      }
    }

    initializePage();
  </script>
</body>
</html>
